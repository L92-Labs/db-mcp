services:
  db-mcp:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      PORT: "8787"
    restart: unless-stopped

  # Optional demo databases: `docker compose --profile demo up --build`, then in .env:
  #   DATABASE_URL=postgres://postgres:postgres@postgres:5432/postgres
  #   MYSQL_URL=mysql://root:root@mysql:3306/shop
  postgres:
    profiles: ["demo"]
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./examples/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - "5432:5432"

  mysql:
    profiles: ["demo"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
    volumes:
      - ./examples/seed.mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ports:
      - "3306:3306"
